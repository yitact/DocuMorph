name: documorph
description: "An offline-first mobile document scanner, multimodal financial parser, and expense intelligence suite built with Flutter."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Core OCR & Image Processing
  image_picker: ^1.1.2
  google_mlkit_text_recognition: ^0.14.0
  flutter_perspective_crop: ^1.0.0
  
  # Sharing & Export
  share_plus: ^10.0.0
  qr_flutter: ^4.1.0
  pdf: ^3.10.0
  printing: ^5.11.0
  
  # Storage & Database
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  # Analytics & Charts
  fl_chart: ^0.65.0
  intl: ^0.19.0
  
  # Cloud & Sync
  firebase_core: ^2.24.0
  cloud_firestore: ^4.14.0
  firebase_storage: ^11.6.0
  
  # Security & Authentication
  local_auth: ^2.1.0
  flutter_secure_storage: ^9.0.0
  crypto: ^3.1.0
  
  # AI & Parsing
  google_generative_ai: ^0.3.0
  
  # In-App Purchases
  purchases_flutter: ^7.0.0
  
  # State Management & Notifications
  provider: ^6.0.0
  flutter_local_notifications: ^14.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  hive_generator: ^2.0.0
  build_runner: ^2.4.0

flutter:
  uses-material-design: true
